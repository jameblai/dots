# vesper colors
BG="#101010"
BG_ELEVATED="#1A1A1A"
BG_SELECTED="#232323"
FG="#FFFFFF"
FG_MUTED="#A0A0A0"
FG_DIM="#5C5C5C"
ACCENT="#FFC799"
MINT="#99FFE4"
BORDER="#282828"

# true color
set -ag terminal-overrides ",*:RGB"

# renumber windows
set -g renumber-windows on

# splits in cwd
bind \\ split-window -h -c "#{pane_current_path}"
bind Enter split-window -v -c "#{pane_current_path}"

# new window in cwd
bind c new-window -c "#{pane_current_path}"

# pane nav without prefix: alt+hjkl
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# pane nav with prefix
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize without prefix: alt+shift+hjkl
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

# window nav without prefix
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-n next-window
bind -n M-p previous-window

# quick actions
bind x kill-pane
bind X kill-window
bind z resize-pane -Z

# session switcher
bind s display-popup -E -w 40% -h 40% -S "fg=#282828" -b rounded \
  "tmux list-sessions -F '#S' | fzf --reverse --border=none --margin=1 --padding=1 \
  --prompt='  ' --pointer='▌' --no-scrollbar \
  --color=bg:#101010,bg+:#232323,fg:#A0A0A0,fg+:#FFFFFF,hl:#FFC799,hl+:#FFC799,pointer:#FFC799,prompt:#FFC799,info:#5C5C5C \
  | xargs -I{} tmux switch-client -t {}"

# sessionizer
bind f display-popup -E -w 50% -h 50% -S "fg=#282828" -b rounded \
  "~/.config/tmux/scripts/sessionizer"

# last session
bind L switch-client -l

# reload
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# copy mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# no bells
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# status bar
set -g status-position top
set -g status-justify left
set -g status-style "bg=#101010 fg=#A0A0A0"
set -g status-interval 1

# left: session
set -g status-left "#[fg=#FFC799,bold] #S #[fg=#5C5C5C]│ "
set -g status-left-length 20

# right: time only
set -g status-right "#[fg=#A0A0A0]%-I:%M %p "
set -g status-right-length 50

# window format
setw -g window-status-format "#[fg=#5C5C5C] #I #W "
setw -g window-status-current-format "#[fg=#FFFFFF,bold] #I #W "
setw -g window-status-separator ""

# pane borders
set -g pane-border-lines simple
set -g pane-border-style "fg=#282828"
set -g pane-active-border-style "fg=#FFC799"

# message style
set -g message-style "bg=#232323 fg=#FFFFFF"
set -g message-command-style "bg=#232323 fg=#FFFFFF"

# mode style
setw -g mode-style "bg=#232323 fg=#FFFFFF"

# clock
setw -g clock-mode-colour "#FFC799"
